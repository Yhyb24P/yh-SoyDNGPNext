    samples: 20506
    traits: 24
    note: >
      20506 samples x 24 traits (10 quality + 14 quantitative) plus
      CommonName. Normalization ranges for the quantitative traits are in
      the repo's predict/n_trait.txt (e.g. protein 31.7-57.9, matching the
