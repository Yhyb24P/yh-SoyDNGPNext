    sha256: a57b8db4bdcc860f03845d363ac4f181af024e82993f9b3a68824109bfb1ee14
    lines: 32033
    note: >
      Ordered SNP list (CHROM_POS format, same ID scheme as the reader).
      The website code (dataprocess_predict.py) reorders any uploaded VCF
      to this order (df[self.pos_list]); SNPs absent from the VCF are
      imputed as './.' (code 3). 32033 source lines; pd.read_csv consumes
      line 1 as the header, so the effective list is 32032 (= the paper's
      figure; the off-by-one is resolved, see d1_paper_snp_contract below).
      Either way < 42436, so the 206x206 grid is filled by wrap.
